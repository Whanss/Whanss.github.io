name: Deploy static content to Pages

on:
  # Berjalan otomatis setiap ada push ke branch main
  push:
    branches: ["main"]

  # Memungkinkan workflow ini dijalankan secara manual dari tab Actions
  workflow_dispatch:

# Mengatur izin untuk GITHUB_TOKEN agar dapat deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah deployment yang bertumpuk
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite akan meng-compile file ke folder 'dist'
          path: "./dist"
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
